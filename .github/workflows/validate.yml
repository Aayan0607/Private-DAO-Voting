name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run chain:test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright install --with-deps chromium
      - name: Browser workflow
        run: |
          npm run demo:start > /tmp/private-dao-demo.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/api/voting > /dev/null; then break; fi
            sleep 2
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/
